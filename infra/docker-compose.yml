services:
  auditoria-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: auditoria-sqlserver
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
    expose:
      - "1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  code-audit-ai-service:
    build:
      context: ../code-audit-ai-service
    container_name: code-audit-ai-service
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
    container_name: auditoria-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PYTHON_AI_SERVICE_URL: http://code-audit-ai-service:8000
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:*,http://127.0.0.1:*,https://intimate-actively-escargot.ngrok-free.app
      SPRING_DATASOURCE_URL: jdbc:sqlserver://auditoria-db:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      auditoria-db:
        condition: service_healthy
      code-audit-ai-service:
        condition: service_healthy

  frontend:
    build:
      context: ../Frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_BASE_PATH: /
    container_name: auditoria-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlserver-data:

networks:
  default:
    name: dev-net
    external: true