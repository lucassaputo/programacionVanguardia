server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

python.ai-service.url=${PYTHON_AI_SERVICE_URL:http://localhost:8000}
python.ai-service.max-attempts=${PYTHON_AI_SERVICE_MAX_ATTEMPTS:2}
python.ai-service.circuit-breaker.failure-threshold=${PYTHON_AI_SERVICE_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
python.ai-service.circuit-breaker.open-duration-seconds=${PYTHON_AI_SERVICE_CIRCUIT_BREAKER_OPEN_DURATION_SECONDS:30}

analysis.rate-limit.max-requests=${ANALYSIS_RATE_LIMIT_MAX_REQUESTS:10}
analysis.rate-limit.window-seconds=${ANALYSIS_RATE_LIMIT_WINDOW_SECONDS:60}
analysis.cost.max-estimated-tokens=${ANALYSIS_COST_MAX_ESTIMATED_TOKENS:6000}
analysis.cost.estimated-usd-per-million-tokens=${ANALYSIS_COST_ESTIMATED_USD_PER_MILLION_TOKENS:0.15}
